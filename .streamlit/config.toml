# Recon-Agent theme — "the compliance war room".
# Ledger navy surfaces, paper-toned text, brass primary (money, not neon),
# stamp green/red for recovered/exposed ITC. Serif headings (Source Serif 4,
# the register of official Indian tax documents), IBM Plex Sans for UI copy,
# IBM Plex Mono for figures, code and stamps.
[theme]
base = "dark"
backgroundColor = "#131A29"
secondaryBackgroundColor = "#1B2537"
primaryColor = "#C9A227"
textColor = "#E8E4D8"
codeBackgroundColor = "#0E1524"
codeTextColor = "#D8B94E"
linkColor = "#D8B94E"
redColor = "#E5484D"
greenColor = "#30A46C"
orangeColor = "#D08700"
blueColor = "#7A93C4"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = 600
headingFontSizes = ["2.45rem", "1.9rem", "1.5rem", "1.2rem", "1.05rem", "0.95rem"]
metricValueFontWeight = 600

[theme.sidebar]
backgroundColor = "#0F1524"
