AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Recon-Agent core infrastructure (WeMakeDevs AWS First Commit).
  DynamoDB table for reconciliation results and the A2A audit trail,
  an S3 bucket for uploaded purchase registers / GSTR-2B extracts, and
  a least-privilege execution role for the application runtime.
  All resources are tagged for the hackathon project.

Parameters:
  ProjectName:
    Type: String
    Default: recon-agent
    Description: Resource name prefix and tag value.
  Stage:
    Type: String
    Default: demo
    AllowedValues: [demo, prod]
    Description: Deployment stage used in resource names and tags.
  # Spend is capped with an AWS Budgets budget on the account (pay-per-request
  # tables and tiny Converse calls keep this stack in the cents range); a
  # declared-but-unused template parameter would only pretend to guard it.

Resources:
  ############################################################
  # DynamoDB — reconciliation results + A2A WhatsApp audit trail
  ############################################################
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-results-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: stage
          Value: !Ref Stage

  ############################################################
  # S3 — uploaded registers and GSTR-2B extracts (private)
  ############################################################
  UploadsBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-uploads-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: stage
          Value: !Ref Stage

  ############################################################
  # IAM — least-privilege runtime role for the application
  ############################################################
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-app-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: dynamodb-results
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt ResultsTable.Arn
        - PolicyName: s3-uploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${UploadsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt UploadsBucket.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: stage
          Value: !Ref Stage

  ############################################################
  # Observability — spend guard + table alarms (demo-scale)
  ############################################################
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts-${Stage}"
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: stage
          Value: !Ref Stage

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref "AWS::AccountId"

  # Spend guard — a first-class budget (no legacy billing-metric dependency)
  # that notifies the alerts topic at 80% and 100% of the demo cap.
  DemoSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-demo-spend-${Stage}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
  TableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-dynamodb-throttles-${Stage}"
      AlarmDescription: Reconciliation table requests are being throttled.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref ResultsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlertsTopic]

  TableSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-dynamodb-syserrors-${Stage}"
      AlarmDescription: DynamoDB is returning server-side errors on the results table.
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref ResultsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  ResultsTableName:
    Description: DynamoDB table for reconciliation results + audit trail
    Value: !Ref ResultsTable
  UploadsBucketName:
    Description: S3 bucket for uploaded registers / 2B extracts
    Value: !Ref UploadsBucket
  AppRoleArn:
    Description: Least-privilege role the application runtime should assume
    Value: !GetAtt AppRole.Arn
  AlertsTopicArn:
    Description: SNS topic for spend and table alarms (subscribe an email here)
    Value: !Ref AlertsTopic
