name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate fixtures
        run: python fixtures/generate_mock_data.py

      # Tests must never touch deployed AWS resources; the suites already
      # fence persistence themselves, and this makes the guarantee explicit.
      env:
        RECON_RESULTS_TABLE: ""
        RECON_UPLOADS_BUCKET: ""
        AWS_ACCESS_KEY_ID: ""
        AWS_SECRET_ACCESS_KEY: ""
        AWS_DEFAULT_REGION: us-east-1

      - name: Router suite (cost cascade)
        run: python tests/test_smart_router.py

      - name: Backend suite (persistence + comms agent)
        run: python tests/test_backend.py

      - name: Fixture/pipeline suite
        run: python tests/validate_fixtures.py

      - name: Headless UI suite
        run: python tests/smoke_ui.py

      - name: Export the web snapshot from the engine
        run: python scripts/export_snapshot.py

      - name: API suite (FastAPI surface the web client calls)
        run: python tests/test_api.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Every locale must cover the tier it advertises (interface or full),
      # with no stray keys and no language offered without a table.
      - name: Locale coverage
        run: bun run check:i18n

      # Renders the real component trees (login page + signed-in workspace) to
      # static markup: catches missing providers and bad imports that tsc and
      # the bundler both accept.
      - name: Render smoke test
        run: bun run smoke

      - name: Build
        run: bun run build
